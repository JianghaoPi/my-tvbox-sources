name: update
on:
  schedule:
    # 每日 2 次：UTC 03:00 / 15:00 ≈ 北京时间 11:00 / 23:00
    - cron: '0 3,15 * * *'
  push:
    # 防死循环①：只监听人工维护的文件；自动提交只改 output/ 与 README.md，互不触发
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Aggregate sources
        run: python scripts/update.py

      - name: Refresh live sources
        run: python scripts/live.py --aggregate output/aggregate.json

      - name: Commit & push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output README.md
          # 无变化则跳过提交（也避免空 commit 噪音）；[skip ci] 为防死循环②双保险
          git diff --cached --quiet || git commit -m "auto: update aggregated sources [skip ci]"
          git push
